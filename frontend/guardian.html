<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="EchoAid Guardian Mode — manage keywords, phrases, and communication preferences." />
  <title>EchoAid — Guardian Mode</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />

  <style>
    /* ── Guardian layout ─────────────────────────────────────────────── */
    .guardian-layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: calc(100vh - var(--header-height));
    }

    .guardian-sidebar {
      background-color: var(--color-surface);
      border-right: 1.5px solid var(--color-border);
      padding: var(--space-4) 0;
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
      overflow-y: auto;
    }

    .guardian-sidebar__label {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      padding: var(--space-3) var(--space-5);
      margin-top: var(--space-4);
    }

    .guardian-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-secondary);
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--transition-base), color var(--transition-base);
    }
    .guardian-nav-item:hover,
    .guardian-nav-item.active {
      background-color: var(--color-primary-subtle);
      color: var(--color-primary);
    }
    .guardian-nav-item:focus-visible {
      outline: none;
      box-shadow: inset var(--focus-ring);
    }

    .guardian-main {
      padding: var(--space-8);
      overflow-y: auto;
    }

    /* ── PIN screen ───────────────────────────────────────────────────── */
    .pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
      min-height: 70vh;
      text-align: center;
      padding: var(--space-8);
    }

    /* ── Modal overlay ────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: var(--z-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--color-surface);
      max-height: 90vh;
      overflow-y: auto;
    }

    /* ── Responsive sidebar ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      .guardian-layout { grid-template-columns: 1fr; }
      .guardian-sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1.5px solid var(--color-border);
        padding: var(--space-3) 0;
      }
      .guardian-sidebar .guardian-sidebar__section {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-4);
      }
      .guardian-nav-item {
        width: auto;
        border-radius: var(--radius-full);
        padding: var(--space-2) var(--space-4);
        border: 1.5px solid var(--color-border);
      }
      .guardian-sidebar__label { display: none; }
      .guardian-main { padding: var(--space-5); }
    }
  </style>
</head>
<body>

<!-- Screen-reader announcer -->
<div id="sr-announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>

<!-- ── Site Header ───────────────────────────────────────────────── -->
<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a href="/" class="logo" aria-label="EchoAid home">
      <div class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v20M8 6v12M4 9v6M16 6v12M20 9v6"/>
        </svg>
      </div>
      <span class="logo__wordmark">Echo<span>Aid</span></span>
    </a>

    <nav class="site-header__nav" aria-label="Header navigation">
      <span class="badge badge-neutral">Guardian Mode</span>
      <a href="/patient" class="btn btn-ghost btn-sm hide-mobile">← Patient Mode</a>
      <div id="health-indicator" class="flex items-center gap-2"
           aria-label="Backend status" title="Backend status">
        <span class="status-dot status-dot--loading" aria-hidden="true"></span>
        <span class="status-label text-xs text-secondary hide-mobile">checking…</span>
      </div>
    </nav>
  </div>
</header>

<!-- ── App mount point ───────────────────────────────────────────── -->
<main id="main-content" role="main">
  <div id="guardian-app">
    <!-- JS renders PIN screen or dashboard here -->
    <div class="flex items-center justify-center" style="min-height:60vh;">
      <div class="spinner" aria-label="Loading Guardian Mode…"></div>
    </div>
  </div>
</main>

<!-- ── Footer ────────────────────────────────────────────────────── -->
<footer class="site-footer" role="contentinfo">
  <div class="site-footer__inner">
    <span>© 2026 EchoAid — Guardian Mode</span>
    <a href="/" class="text-xs">← Home</a>
  </div>
</footer>

<!-- ── Scripts ───────────────────────────────────────────────────── -->
<script src="/static/js/app.js?v=3"></script>
<script src="/static/js/guardian.js?v=3"></script>

</body>
</html>
